<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><span class="dot" id="dot" title="status"></span>Jarvis <span class="sub">test UI</span></div>
    <div class="actions">
      <label class="toggle" title="Speak replies on the laptop speakers">
        <input type="checkbox" id="speak"><span>Speak on laptop</span>
      </label>
      <select id="lang" title="Reply language">
        <option value="">Auto</option><option value="en">English</option>
        <option value="ne">नेपाली</option><option value="hi">हिन्दी</option>
      </select>
      <button id="clear" class="ghost" title="Clear the chat view">Clear</button>
      <button id="panelBtn" class="ghost" title="Show status">Status</button>
    </div>
  </header>

  <main class="main">
    <section class="chat">
      <div id="log" class="log" aria-live="polite">
        <div class="empty" id="empty">Ask me anything. Try “what time is it?”</div>
      </div>
      <form id="form" class="composer" autocomplete="off">
        <button type="button" id="mic" class="mic" title="Hold a short voice message (click to start/stop)" aria-label="Microphone">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Message Jarvis… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button type="submit" id="send" class="send">Send</button>
      </form>
    </section>

    <aside id="panel" class="panel">
      <div class="panel-head"><h2>Status</h2><span class="muted" id="updated"></span></div>
      <div class="stats">
        <div class="stat"><span class="k">RAM (server)</span><span class="v" id="sRam">–</span></div>
        <div class="stat"><span class="k">Tokens today</span><span class="v" id="sTok">–</span></div>
        <div class="stat"><span class="k">Fast-path hits</span><span class="v" id="sFast">–</span></div>
        <div class="stat"><span class="k">Profile facts</span><span class="v" id="sFacts">–</span></div>
        <div class="stat"><span class="k">Agent</span><span class="v" id="sAgent">–</span></div>
        <div class="stat"><span class="k">Workers</span><span class="v" id="sWorkers">–</span></div>
      </div>
      <h3>Running jobs</h3>
      <ul id="jobs" class="list"><li class="muted">none</li></ul>
      <h3>Recent alerts</h3>
      <ul id="alerts" class="list"><li class="muted">none</li></ul>
    </aside>
  </main>
</div>
<template id="confirmTpl">
  <div class="confirm">
    <div class="confirm-q"></div>
    <div class="confirm-btns"><button class="yes">Yes</button><button class="no ghost">No</button></div>
  </div>
</template>
<script src="/app.js"></script>
</body>
</html>
